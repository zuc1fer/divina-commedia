<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>DIVINA COMMEDIA — a developer's descent</title>
  <meta name="description" content="From the Empyrean of production software to the frozen ninth circle of the craft. A portfolio in nine descents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Preloader: the gate -->
  <div id="preloader" aria-hidden="true">
    <div class="pre-ring"></div>
    <div class="pre-text">
      <span class="pre-count">0</span>
      <span class="pre-quote">«&nbsp;Through me the way into the suffering city.&nbsp;»</span>
    </div>
    <button id="enter" class="enter-btn" disabled>Begin the descent</button>
  </div>

  <!-- The WebGL world (fixed, behind everything) -->
  <canvas id="world"></canvas>

  <!-- The faller: a dark knight, tumbling through every realm -->
  <div id="faller" aria-hidden="true">
    <div class="faller-spin">
      <img src="/assets/figures/knight.png" alt="" onerror="this.style.display='none'" />
    </div>
  </div>

  <div id="grain" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- Fixed UI -->
  <header class="hud">
    <div class="hud-mark">DIVINA&nbsp;COMMEDIA</div>
    <div class="hud-progress"><span id="hud-stage">EMPYREAN</span><i id="hud-bar"></i></div>
    <button id="sound" class="hud-sound" aria-label="Toggle ambient sound" title="Ambient sound">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path id="wave" d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="scroll-cue" id="scrollcue"><span>scroll to fall</span><i></i></div>

  <!-- Content is injected by content.js -->
  <main id="app"></main>

  <script type="module" src="/src/main.js"></script>
  <noscript><p style="color:#fff;font-family:sans-serif;padding:2rem">This descent requires JavaScript.</p></noscript>
</body>
</html>
